  day: '2026-11-05'
  photo: day3-nov6/20261105-165854_IMG_9958.jpg
  title:
    ru: Мгновение, ставшее бессмертным
    en: A split second made immortal
  text:
    ru: 'Табличка у мемориала морской пехоты в Вашингтоне. Сам мемориал повторяет знаменитую фотографию Джо Розенталя: шестеро морпехов поднимают флаг на острове Иводзима в феврале 1945 года. Мало кто знает, что флаг в тот день поднимали дважды, и на снимке второй раз: первый флаг решили заменить на более крупный. За эту фотографию Розенталь получил Пулитцеровскую премию.'
    en: "A sign at the Marine Corps War Memorial in Washington. The memorial reproduces Joe Rosenthal's famous photo: six Marines raising the flag on Iwo Jima in February 1945. Few people know the flag went up twice that day, and the photo shows the second time: the first flag was swapped for a bigger one. Rosenthal won the Pulitzer Prize for it."
  sources:
  - https://en.wikipedia.org/wiki/Raising_the_Flag_on_Iwo_Jima
  check: true
