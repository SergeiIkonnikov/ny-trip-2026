  day: '2026-11-10'
  photo: notes/kate-leopold-bridge.jpg
  moment: brooklyn-bridge
  title:
    ru: Портал на Бруклинском мосту
    en: A portal on the Brooklyn Bridge
  text:
    ru: |
      В фильме «Кейт и Леопольд» (2001) Бруклинский мост работает как машина времени. Физик Стюарт (Лев Шрайбер) находит под ним портал и проваливается в 1876 год. Там за ним гонится герцог Леопольд (Хью Джекман), и в наше время, к Мег Райан, они попадают вместе. В финале уже Кейт прыгает с моста, чтобы вернуться к Леопольду в XIX век.
      В 1876 году мост ещё строили, и Леопольд в фильме рисует его на церемонии в честь завершения манхэттенской башни. На этой церемонии среди героев есть и Джон Роблинг. Хотя в настоящей истории, как мы помним по заметке про Эмили Роблинг, он умер в 1869 году, ещё до начала стройки. Но в кино с машиной времени можно.
    en: |
      In Kate & Leopold (2001) the Brooklyn Bridge works as a time machine. The physicist Stuart (Liev Schreiber) finds a portal under it and falls into 1876. There Duke Leopold (Hugh Jackman) chases him, and they both tumble into the present, into Meg Ryan's life. In the finale it's Kate who jumps off the bridge to go back to Leopold in the 19th century.
      In 1876 the bridge was still being built, and in the film Leopold sketches it at a ceremony marking the completion of the Manhattan tower. Among the characters at that ceremony is John Roebling. In real history, as the note about Emily Roebling says, he died in 1869, before construction even began. But in a film with a time machine, anything goes.
  sources:
  - https://en.wikipedia.org/wiki/Kate_%26_Leopold
- id: note-manhattan-bridge-view
  topics:
  - views
  - details
  day: '2026-11-10'
  photo: day7-last/20261110-163205_IMG_1029.jpg
  title:
    ru: Тот самый вид из Дамбо
    en: That view from DUMBO
  text:
    ru: |
      Этот кадр снимают все, кто доходит до Дамбо: угол Вашингтон-стрит и Уотер-стрит, между двумя кирпичными складами Манхэттенский мост, а под его аркой, если повезёт с углом, виден Эмпайр-стейт-билдинг. Нам повезло. Мост, кстати, не Бруклинский, а соседний, Манхэттенский: его открыли в 1909 году, через 26 лет после Бруклинского.
      Знаменитым этот вид сделал Серджо Леоне. В фильме «Однажды в Америке» (1984) здесь снимали несколько сцен, а кадр с мостом в конце улицы попал на афишу. С тех пор это одна из самых узнаваемых улиц Нью-Йорка. А в двух шагах, в арке под этим же мостом, бежит Джокер Хоакина Феникса в трейлере фильма 2019 года.
      Само название Дамбо — сокращение от Down Under the Manhattan Bridge Overpass, «под съездом с Манхэттенского моста». Его придумали в 1978 году местные жители, надеясь, что такое некрасивое имя отпугнёт застройщиков. Не отпугнуло.
    en: |
      Everyone who makes it to DUMBO takes this shot: the corner of Washington and Water Streets, the Manhattan Bridge between two brick warehouses, and under its arch, if you get the angle right, the Empire State Building. We got it right. The bridge, by the way, isn't the Brooklyn Bridge but its neighbour, the Manhattan Bridge, opened in 1909, 26 years after the Brooklyn.
      Sergio Leone made this view famous. Several scenes of Once Upon a Time in America (1984) were filmed here, and the shot of the bridge at the end of the street went onto the poster. Ever since, it's been one of the most recognisable streets in New York. And a few steps away, in the archway under the same bridge, Joaquin Phoenix's Joker runs through the 2019 film's trailer.
      The name DUMBO itself stands for Down Under the Manhattan Bridge Overpass. Locals coined it in 1978, hoping such an unattractive name would scare off developers. It didn't.
  sources:
  - https://en.wikipedia.org/wiki/DUMBO
  - https://en.wikipedia.org/wiki/Manhattan_Bridge
