moments:
  # ---------- Day 0 ----------
  - id: cyprus-start
    day: "2026-11-03"
    from: "00:00"
    to: "13:00"
    topics: [transport]
    place: {name: "Кипр / Cyprus", lat: 34.869, lon: 33.610}
    title: {ru: "Старт", en: "Off we go"}
    text:
      ru: "Первые кадры поездки: ещё Кипр, ещё тепло. Впереди Доха и Нью-Йорк."
      en: "The first shots of the trip: still Cyprus, still warm. Doha and New York ahead."
  - id: doha-docs
    day: "2026-11-03"
    from: "13:00"
    to: "18:30"
    topics: [transport, people]
    place: {name: "Hamad International Airport, Doha", lat: 25.263, lon: 51.613}
    title: {ru: "Восемь часов в Дохе и потерянные документы", en: "Eight hours in Doha and the lost documents"}
    text:
      ru: |
        В Дохе мы потеряли документы. Несколько очень длинных минут, пока не нашли: всё это время они спокойно лежали в красной сумочке Comme des Garçons.
        Аэропорт огромный, красивый и удобный, внутри между терминалами ходит поезд.
      en: |
        In Doha we lost our documents. A few very long minutes until we found them: they had been sitting quietly in the red Comme des Garçons bag the whole time.
        The airport is huge, beautiful and comfortable, with a train running between the terminals.
  - id: doha-grass
    day: "2026-11-03"
    from: "18:30"
    to: "23:59"
    topics: [transport, details]
    place: {name: "Hamad International Airport, Doha", lat: 25.270, lon: 51.611}
    title: {ru: "Сон на траве под деревьями", en: "Sleeping on the grass under trees"}
    text:
      ru: "Для сна в аэропорту есть специальные места, но мы выбрали зелёную зону. Трава там искусственная, а деревья настоящие. Очень круто."
      en: "The airport has proper places to sleep, but we chose the indoor garden. The grass is artificial, the trees are real. Very cool."
    tip:
      ru: "Пересадка в Хамаде на 8 часов не страшна: ищите зелёную зону с деревьями."
      en: "An 8-hour layover at Hamad is fine: look for the indoor garden with the trees."

  # ---------- Day 1 ----------
  - id: jfk
    day: "2026-11-04"
    from: "07:00"
    to: "10:40"
    topics: [transport]
    place: {name: "JFK Airport", lat: 40.648, lon: -73.791}
    title: {ru: "Прилёт и отель", en: "Landing and the hotel"}
    text:
      ru: "Прилетели рано утром. Наш отель, voco на 48-й улице, в двух шагах от Таймс-сквер, но заселение только в 16:00. Оставили вещи и пошли гулять."
      en: "We landed early in the morning. Our hotel, voco on 48th Street, is a couple of minutes from Times Square, but check-in was only at 4 pm. We left our bags and went out."
  - id: card-tricks
    day: "2026-11-04"
    topics: [people, details]
    place: {name: "voco Times Square Broadway", lat: 40.7597, lon: -73.9840}
    title: {ru: "Фокусы в лобби", en: "Card tricks in the lobby"}
    text:
      ru: "Пока ждали заселения, Макар показывал карточные фокусы всем в лобби. Публика была благодарная."
      en: "While we waited to check in, Makar did card tricks for everyone in the lobby. A grateful audience."
  - id: bull
    day: "2026-11-04"
    from: "11:30"
    to: "13:30"
    topics: [art, views]
    place: {name: "Wall Street, Charging Bull & Fearless Girl", lat: 40.7056, lon: -74.0134}
    title: {ru: "Бык и «Бесстрашная девочка»", en: "The Charging Bull and Fearless Girl"}
    text:
      ru: "Финансовый район. Бронзовый бык, у которого всегда очередь, и «Бесстрашная девочка» напротив Нью-Йоркской фондовой биржи."
      en: "The Financial District. The bronze bull with its permanent queue, and Fearless Girl facing the New York Stock Exchange."
    price: {usd: 0, note: {ru: "бесплатно", en: "free"}}
  - id: liberty
    day: "2026-11-04"
    from: "13:30"
    to: "16:00"
    topics: [transport, views]
    place: {name: "Liberty Island", lat: 40.6892, lon: -74.0445}
    title: {ru: "Кораблик к Статуе Свободы", en: "The boat to the Statue of Liberty"}
    text:
      ru: "Из Бэттери-парка на кораблике до острова Свободы. Статуя вблизи больше, чем кажется на фото."
      en: "From Battery Park by boat to Liberty Island. Up close, the statue is bigger than it looks in photos."
    price: {usd: null, per: person}
    link: "https://www.cityexperiences.com/new-york/city-cruises/statue/"
    check: true
  - id: dinner-150
    day: "2026-11-04"
    from: "17:00"
    to: "19:00"
    topics: [food, metro, people]
    place: {name: "Lower Manhattan", lat: 40.709, lon: -74.012}
    title: {ru: "Ужин за $150 и первое метро", en: "A $150 dinner and our first subway ride"}
    text:
      ru: |
        Первое удивление: всё очень дорого, и к цене в меню ещё прибавляются налог и чаевые. Ужин на троих вышел в $150.
        Макар уснул прямо в кафе, так крепко, что Наташе пришлось немного его нести. Такси до отеля стоило бы около $60, поэтому поехали на метро, со спящим ребёнком. Долго не могли понять, какой поезд нам нужен, но разобрались.
      en: |
        First surprise: everything is very expensive, and tax and tip go on top of the menu price. Dinner for three came to $150.
        Makar fell asleep right in the café, so soundly that Natasha had to carry him for a bit. A taxi to the hotel would have been about $60, so we took the subway, sleeping child and all. It took us a while to work out which train we needed, but we got there.
    price: {usd: 150, per: family, note: {ru: "ужин на троих с налогом и чаевыми", en: "dinner for three, tax and tip included"}}

  # ---------- Day 2 ----------
  - id: dc-tour
    day: "2026-11-05"
    from: "09:00"
    to: "11:40"
    topics: [transport, people]
    place: {name: "Washington, D.C.", lat: 38.8893, lon: -77.0502}
    title: {ru: "Автобус в Вашингтон и гид Дэвид", en: "The bus to Washington and our guide David"}
    text:
      ru: "Экскурсию бронировали через GetYourGuide. Гид Дэвид был офигенный, хоть английский у него и не самый лучший."
      en: "We booked the tour on GetYourGuide. Our guide David was brilliant, even if his English wasn't perfect."
    price: {usd: null, per: person}
    link: "https://www.getyourguide.com/"
    check: true
  - id: arlington
    day: "2026-11-05"
    from: "11:40"
    to: "12:30"
    topics: [people]
    place: {name: "Arlington National Cemetery", lat: 38.8783, lon: -77.0687}
    title: {ru: "Арлингтонское кладбище", en: "Arlington National Cemetery"}
    text:
      ru: "Главное военное кладбище США, здесь похоронено больше 400 тысяч человек. Тут могила Джона Кеннеди с вечным огнём и Могила Неизвестного солдата, у которой круглосуточно стоит почётный караул."
      en: "America's main military cemetery, where more than 400,000 people are buried. It holds John F. Kennedy's grave with its eternal flame and the Tomb of the Unknown Soldier, guarded around the clock."
    check: true
  - id: korea-lincoln
    day: "2026-11-05"
    from: "12:30"
    to: "13:15"
    topics: [art]
    place: {name: "Lincoln Memorial", lat: 38.8893, lon: -77.0502}
    title: {ru: "Солдаты в дождевиках и Линкольн", en: "Soldiers in ponchos, and Lincoln"}
    text:
      ru: |
        Мемориал ветеранов войны в Корее: 19 стальных солдат в дождевиках будто идут в патруле через кусты.
        Рядом мемориал Линкольна, похожий на греческий храм: 36 колонн, по числу штатов на момент смерти президента, а внутри сидящий Линкольн высотой почти 6 метров. На этих ступенях Мартин Лютер Кинг произнёс речь «У меня есть мечта».
      en: |
        The Korean War Veterans Memorial: 19 steel soldiers in ponchos, as if on patrol through the bushes.
        Next to it, the Lincoln Memorial, built like a Greek temple: 36 columns, one for each state at the time of Lincoln's death, and inside a seated Lincoln nearly 6 metres tall. Martin Luther King gave his "I Have a Dream" speech on these steps.
    price: {usd: 0, note: {ru: "бесплатно", en: "free"}}
  - id: air-space
    day: "2026-11-05"
    from: "13:15"
    to: "14:40"
    topics: [art, transport]
    place: {name: "National Air and Space Museum", lat: 38.8882, lon: -77.0199}
    title: {ru: "Музей авиации и космонавтики", en: "The Air and Space Museum"}
    text:
      ru: "Лунный модуль «Аполлона», капсулы первых астронавтов, ракеты, скафандры. Макар за штурвалом в кабине-тренажёре. Вход бесплатный, как во все музеи Смитсоновского института."
      en: "An Apollo lunar module, the capsules of the first astronauts, rockets, spacesuits. Makar at the controls of a cockpit simulator. Entry is free, as in all Smithsonian museums."
    price: {usd: 0, note: {ru: "бесплатно", en: "free"}}
  - id: capitol
    day: "2026-11-05"
    from: "14:40"
    to: "15:10"
    topics: [people, views]
    place: {name: "U.S. Capitol", lat: 38.8899, lon: -77.0091}
    title: {ru: "Капитолий", en: "The Capitol"}
    text:
      ru: "Здесь заседает Конгресс. Чугунный купол достраивали прямо во время Гражданской войны. На лужайке Макар с Машей, дочкой наших друзей: она тоже пианистка и тоже приехала на конкурс."
      en: "Home of Congress. The cast-iron dome was finished during the Civil War. On the lawn: Makar with Masha, our friends' daughter, also a pianist, also here for the competition."
    privacy: masha
  - id: white-house
    day: "2026-11-05"
    from: "15:10"
    to: "16:00"
    topics: [views]
    place: {name: "The White House", lat: 38.8997, lon: -77.0366}
    title: {ru: "Белый дом", en: "The White House"}
    text:
      ru: "Резиденция президентов с 1800 года. Смотрели с северной стороны, от Лафайет-сквер."
      en: "Home of US presidents since 1800. We saw it from the north side, from Lafayette Square."
  - id: lady-in-frame
    day: "2026-11-05"
    topics: [details, people]
    place: {name: "Washington, D.C.", lat: 38.8999, lon: -77.0365}
    title: {ru: "Женщина, которая была везде", en: "The woman who was everywhere"}
    text:
      ru: "Локальный мем дня. Весь день в наши кадры попадала одна и та же женщина: на кладбище в красной кофте, у Белого дома, на тротуаре. Мы её не знаем, но к вечеру она стала почти членом группы."
      en: "The meme of the day. The same woman kept walking into our shots: at the cemetery in a red top, at the White House, on the pavement. We don't know her, but by the evening she was almost part of the group."
    photos: ["20261105-194251", "20261105-203452"]
    privacy: stranger
  - id: weehawken
    day: "2026-11-05"
    from: "20:00"
    to: "20:55"
    topics: [views]
    place: {name: "Weehawken waterfront, NJ", lat: 40.772, lon: -74.016}
    title: {ru: "Ночной Манхэттен с того берега", en: "Manhattan at night from across the river"}
    text:
      ru: "По дороге обратно автобус остановился на набережной в Нью-Джерси. Через Гудзон весь Мидтаун и Эмпайр-стейт-билдинг. Мы оттуда привезли больше всего фото за день."
      en: "On the way back the bus stopped on the New Jersey waterfront. Across the Hudson: all of Midtown and the Empire State Building. We took more photos here than anywhere else that day."
  - id: times-sq-1
    day: "2026-11-05"
    from: "20:55"
    to: "23:59"
    topics: [views]
    place: {name: "Times Square", lat: 40.758, lon: -73.9855}
    title: {ru: "Таймс-сквер вечером", en: "Times Square in the evening"}
    text:
      ru: "От отеля пять минут пешком, и каждый вечер мы оказывались тут."
      en: "Five minutes on foot from the hotel, and we ended up here every evening."
    price: {usd: 0, note: {ru: "бесплатно", en: "free"}}

  # ---------- Day 3 ----------
  - id: rehearsal-room
    day: "2026-11-06"
    from: "08:00"
    to: "10:00"
    topics: [music]
    place: {name: "Midtown", lat: 40.757, lon: -73.983}
    title: {ru: "Час с пианино", en: "An hour with a piano"}
    text:
      ru: "Утром сняли небольшую комнату с пианино, и Макар час репетировал перед конкурсом."
      en: "In the morning we rented a small room with a piano, and Makar practised for an hour before the competition."
    price: {usd: null, per: family}
    check: true
  - id: roof-bar
    day: "2026-11-06"
    from: "10:00"
    to: "12:00"
    topics: [views]
    place: {name: "voco Times Square Broadway, Roof Bar", lat: 40.7597, lon: -73.9840}
    title: {ru: "Крыша нашего отеля", en: "Our hotel's rooftop"}
    text:
      ru: "Поднялись в Roof Bar на крыше отеля. Таймс-сквер сверху выглядит совсем по-другому."
      en: "We went up to the hotel's Roof Bar. Times Square looks completely different from above."
  - id: esb
    day: "2026-11-06"
    from: "13:00"
    to: "15:10"
    topics: [views]
    place: {name: "Empire State Building", lat: 40.7484, lon: -73.9857}
    title: {ru: "Эмпайр-стейт-билдинг", en: "The Empire State Building"}
    text:
      ru: "102 этажа, построен в 1931 году всего примерно за 13 месяцев. Главная смотровая площадка на 86-м этаже, открытая, со всеми ветрами."
      en: "102 floors, built in 1931 in about 13 months. The main observation deck is on the 86th floor, open to the air and all the wind."
    price: {usd: 60, per: adult, note: {ru: "мы платили $60 за взрослого, детский дешевле; на сайте «от $46» в зависимости от времени", en: "we paid $60 per adult, kids less; the website says 'from $46' depending on time slot"}}
    link: "https://www.esbnyc.com/buy-tickets/86th-floor-observation-deck"
  - id: moma
    day: "2026-11-06"
    from: "15:10"
    to: "18:00"
    topics: [art]
    place: {name: "MoMA", lat: 40.7614, lon: -73.9776}
    title: {ru: "MoMA", en: "MoMA"}
    text:
      ru: "Музей современного искусства: «Звёздная ночь» Ван Гога, «Постоянство памяти» Дали, банки супа Уорхола. Мы были вшестером, вместе с семьёй Маши."
      en: "The Museum of Modern Art: Van Gogh's Starry Night, Dalí's Persistence of Memory, Warhol's soup cans. There were six of us, together with Masha's family."
    link: "https://www.moma.org/"
    check: true
  - id: moma-hack
    day: "2026-11-06"
    topics: [details, art]
