  text:
    ru: |
      Это не декорация. Здание на 14 North Moore Street в Трайбеке построено в 1903 году, и с тех пор в нём работает настоящая пожарная часть, Hook & Ladder 8. В фильме 1984 года сняли только фасад. Внутренние сцены снимали в Лос-Анджелесе, в старой пожарной части.
      В 2011 году часть хотели закрыть ради экономии городского бюджета. Ньюйоркцы её отстояли. Вывеску с привидением, которая теперь висит над воротами, сделали и подарили пожарным фанаты фильма из Буффало.
    en: |
      It isn't a set. The building at 14 North Moore Street in Tribeca went up in 1903 and has housed a working fire company, Hook & Ladder 8, ever since. The 1984 film used only the outside. The interior scenes were shot in Los Angeles, in an old fire station there.
      In 2011 the city planned to close the company to save money. New Yorkers fought for it and won. The ghost sign that now hangs over the doors was made and donated by fans of the film from Buffalo.
