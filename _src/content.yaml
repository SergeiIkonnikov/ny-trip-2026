# Source of truth for the site. Every view (days, topics, map, cheat sheet) is built from `moments`.
# Times are local (`tz` per day). Photos are matched to a moment by local time range [from, to].
# price: usd = number, per = person | family | adult | child ; note = free text
# status: draft text needs Sergey's check -> `check: true`

site:
  title: {ru: "Нью-Йорк, ноябрь 2026", en: "New York, November 2026"}
  tagline:
    ru: "Восемь дней втроём: Наташа, Макар и я. Записано для своих, но заходите все."
    en: "Eight days, the three of us: Natasha, Makar and me. Written for family, but everyone is welcome."
  intro:
    ru: |
      Мы полетели в Нью-Йорк, потому что Макар играл на конкурсе в Карнеги-холле. Поездка быстро стала гораздо больше этого: Вашингтон, Ниагара, метро, в котором мы долго не могли разобраться, MoMA, каток, мюзикл и ужин, на котором официанты поют.
      Здесь всё по дням, по темам и на карте. Цены настоящие, ноябрь 2026 года: интересно будет посмотреть на них через пару лет.
    en: |
      We flew to New York because Makar was playing at a competition in Carnegie Hall. The trip quickly became much more than that: Washington, Niagara Falls, a subway we took a while to figure out, MoMA, an ice rink, a musical and a dinner where the waiters sing.
      Everything is here by day, by topic and on a map. Prices are real, as of November 2026: it will be fun to look at them again in a few years.

