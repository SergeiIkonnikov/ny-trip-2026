- id: note-liberty
  topics:
  - views
  day: '2026-11-04'
  moment: liberty
  title:
    ru: Свобода была рыжей
    en: Liberty used to be copper-coloured
  text:
    ru: Статую Свободы подарила Франция, её открыли в 1886 году. Внутри стальной каркас, который рассчитал Гюстав Эйфель, тот самый. Снаружи тонкая медь. Сначала статуя была цвета новой монетки, а зелёной стала примерно за двадцать лет, когда медь покрылась патиной.
    en: The Statue of Liberty was a gift from France, unveiled in 1886. Inside is a steel frame engineered by Gustave Eiffel, that Eiffel. Outside is thin copper. At first the statue was the colour of a new penny; it turned green over about twenty years as the copper took on a patina.
  sources:
  - https://en.wikipedia.org/wiki/Statue_of_Liberty
- id: note-roebling
  topics:
  - views
  - details
  day: '2026-11-10'
  photo: day7-last/20261110-161538_IMG_1022.jpg
  moment: brooklyn-bridge
  title:
    ru: Женщина, которая достроила мост
    en: The woman who finished the bridge
  text:
    ru: |
      Бруклинский мост спроектировал Джон Роблинг, но он погиб ещё до начала стройки. Дело продолжил его сын Вашингтон, а потом и он слёг: кессонная болезнь после работы под водой. С тех пор он следил за стройкой в подзорную трубу из окна спальни.
      Все распоряжения на стройку передавала его жена Эмили Роблинг. Она выучила математику, сопромат и строительство мостов и одиннадцать лет фактически руководила проектом. Когда мост открыли в 1883 году, она первой проехала по нему, держа на руках петуха, символ победы.
    en: |
      The Brooklyn Bridge was designed by John Roebling, who died before construction even began. His son Washington took over, and then he too was struck down by caisson disease from working under the river. From then on he watched the construction through a telescope from his bedroom.
      Every instruction to the site went through his wife, Emily Roebling. She taught herself the maths, the strength of materials and bridge engineering, and for eleven years effectively ran the project. When the bridge opened in 1883 she was the first to ride across it, holding a rooster, a symbol of victory.
  sources:
  - https://en.wikipedia.org/wiki/Emily_Warren_Roebling
  check: true
- id: note-annie-taylor
  topics:
  - details
  day: '2026-11-07'
  title:
    ru: Учительница в бочке
    en: The teacher in the barrel
  text:
    ru: Первым человеком, который спустился с Ниагарского водопада в бочке и выжил, была учительница Энни Тейлор. Это было в 1901 году, в её 63-й день рождения. Она надеялась прославиться и разбогатеть. Прославилась, но не разбогатела. Выйдя из бочки, сказала, что никому не советует такое повторять.
    en: The first person to go over Niagara Falls in a barrel and survive was a schoolteacher, Annie Edson Taylor. It was 1901, on her 63rd birthday. She hoped for fame and fortune. She got the fame, not the fortune. Climbing out of the barrel, she said nobody should ever try it again.
  sources:
  - https://en.wikipedia.org/wiki/Annie_Edson_Taylor
- id: note-arlington-guard
  topics:
  - details
  day: '2026-11-05'
  moment: arlington
  title:
    ru: Караул, который не уходит
    en: The guard that never leaves
  text:
    ru: 'У Могилы Неизвестного солдата на Арлингтонском кладбище почётный караул стоит без перерыва с 1937 года: днём и ночью, в жару, снег и ураганы. Часовой делает ровно 21 шаг вдоль могилы, разворачивается, стоит 21 секунду и идёт обратно. 21 — как число выстрелов высшего воинского салюта.'
    en: 'At the Tomb of the Unknown Soldier at Arlington, an honour guard has stood without a break since 1937: day and night, through heat, snow and hurricanes. The sentinel takes exactly 21 steps along the tomb, turns, waits 21 seconds and walks back. 21, like the 21-gun salute, the highest military honour.'
  sources:
  - https://en.wikipedia.org/wiki/Tomb_of_the_Unknown_Soldier_(Arlington)
- id: note-carnegie
  topics:
  - music
  day: '2026-11-08'
  moment: carnegie-concert
  title:
    ru: Как попасть в Карнеги-холл
    en: How do you get to Carnegie Hall
  text:
    ru: |
      Карнеги-холл открылся в 1891 году. На открытии дирижировал Пётр Ильич Чайковский: ради этого он приплыл в Америку.
      У американцев есть старый анекдот. Прохожий спрашивает музыканта на улице: «Как попасть в Карнеги-холл?» Тот отвечает: «Репетировать, репетировать и репетировать». Час с пианино два дня назад был ровно про это.
    en: |
      Carnegie Hall opened in 1891. Tchaikovsky conducted at the opening: he crossed the Atlantic for it.
      There's an old American joke. A man stops a musician on the street: "How do you get to Carnegie Hall?" The musician says: "Practice, practice, practice." The hour with a piano two days earlier was exactly about that.
  sources:
  - https://en.wikipedia.org/wiki/Carnegie_Hall
- id: note-new-amsterdam
  topics:
  - music
  - art
  day: '2026-11-10'
  moment: aladdin
  title:
    ru: Театр, который спас Дисней
    en: The theatre Disney saved
  text:
    ru: Театр New Amsterdam, где идёт «Аладдин», открылся в 1903 году. В 1910-е и 20-е здесь шли знаменитые ревю «Безумства Зигфельда». Потом театр стал кинотеатром, пришёл в упадок и долго стоял закрытым. В 1990-е его отреставрировал Disney, и с тех пор он снова театр.
    en: The New Amsterdam Theatre, home of Aladdin, opened in 1903. In the 1910s and 20s it hosted the famous Ziegfeld Follies. Later it became a cinema, fell into decay and stood closed for years. In the 1990s Disney restored it, and it's been a theatre again ever since.
  sources:
  - https://en.wikipedia.org/wiki/New_Amsterdam_Theatre
- id: note-tax-tip
  topics:
  - food
  day: '2026-11-04'
  moment: dinner-150
  title:
    ru: Откуда берутся лишние доллары
    en: Where the extra dollars come from
  text:
    ru: Цены в нью-йоркском меню указаны без налога. К счёту прибавляют налог с продаж 8,875%, а потом принято оставить чаевые, обычно 18–20% (до налога). В итоге блюда на $100 по меню превращаются примерно в $130. Наш ужин на $150 — это, грубо говоря, меню на $115.
    en: New York menu prices don't include tax. The bill adds 8.875% sales tax, and then you're expected to tip, usually 18–20% of the pre-tax amount. So $100 of food on the menu becomes about $130. Our $150 dinner was, roughly, a $115 menu.
  sources:
  - https://en.wikipedia.org/wiki/Sales_taxes_in_the_United_States
- id: note-katz
  topics:
  - food
  - details
  day: '2026-11-10'
  moment: katz
  title:
    ru: Табличка над столиком
    en: The sign above the table
  text:
    ru: |
      Кац работает с 1888 года. Во время Второй мировой войны у них был слоган «Пошли салями своему мальчику в армию», и колбасу действительно отправляли солдатам на фронт.
      Над одним из столиков висит табличка: «Здесь Гарри встретил Салли... Надеемся, вам принесут то же, что и ей». За этим столиком снимали знаменитую сцену из фильма 1989 года.
    en: |
      Katz's has been open since 1888. During the Second World War their slogan was "Send a salami to your boy in the army," and they really did ship salami to soldiers overseas.
      Above one table hangs a sign: "Where Harry met Sally... hope you have what she had!" That's the table where the famous scene from the 1989 film was shot.
  sources:
  - https://en.wikipedia.org/wiki/Katz%27s_Delicatessen
- id: note-pickles
  topics:
  - food
  day: '2026-11-10'
  moment: katz
  photo: day7-last/20261110-180742_IMG_4430.jpg
  title:
    ru: Два цвета огурцов
    en: Two shades of pickle
  text:
    ru: |
      Пока ждёшь сэндвич у Каца, на столе появляется тарелка солёных огурцов. Огурцы на ней двух цветов, и это не случайность.
      Ярко-зелёные — half-sour, «полукислые»: они недолго пролежали в рассоле и ещё хрустят, почти как свежие. Тёмные, оливковые — full-sour, «полностью кислые»: эти ферментировались до конца. Уксуса нет ни в тех, ни в других. Только соль, вода, чеснок, укроп и время. В Нью-Йорке такой огурец называют kosher dill, хотя кошерным в религиозном смысле он быть не обязан: «кошерный» здесь значит «сделанный, как делали еврейские засольщики».
      Делали их как раз здесь. Кац стоит на углу Хаустон и Ладлоу, а в начале XX века улицы Эссекс и Ладлоу называли «огуречным районом»: бочки с огурцами продавали прямо на тротуаре, лавок было около восьмидесяти. Потом иммиграцию ограничили, тележки запретили, и почти все лавки закрылись. Последняя из той эпохи, Guss' Pickles, жива до сих пор.
    en: |
      While you wait for your sandwich at Katz's, a plate of pickles lands on the table. They come in two colours, and that's no accident.
      The bright green ones are half-sours: they've had only a short stay in the brine and still crunch, almost like fresh cucumbers. The dark olive ones are full-sours, fermented all the way. Neither has any vinegar. Just salt, water, garlic, dill and time. In New York this is called a kosher dill, though it needn't be kosher in the religious sense: here "kosher" means "made the way the Jewish pickle men made it".
      And they made it right here. Katz's is on the corner of Houston and Ludlow, and in the early 20th century Essex and Ludlow Streets were the "pickle district": barrels sold straight off the pavement, around eighty shops. Then immigration was restricted, pushcarts were banned, and nearly all of them closed. The last one from that era, Guss' Pickles, is still going.
  sources:
  - https://en.wikipedia.org/wiki/Pickled_cucumber
  - https://en.wikipedia.org/wiki/Guss%27_Pickles
