moments:
  # ---------- Day 0 ----------
- id: cyprus-start
  day: "2026-11-03"
  from: "00:00"
  to: "13:00"
  topics: []
  place: {name: "Кипр / Cyprus", lat: 34.869, lon: 33.610}
  title:
    ru: Старт
    en: Off we go
  text:
    ru: Первые кадры поездки сняты на Кипре. Ещё тепло, ещё всё понятно, ещё никто не знает, сколько стоит ужин в Нью-Йорке.
    en: The first shots of the trip are from Cyprus. Still warm, still simple, and nobody yet knows what dinner costs in New York.
- id: doha-docs
  day: "2026-11-03"
  from: "13:00"
  to: "18:30"
  topics: []
  place: {name: "Hamad International Airport, Doha", lat: 25.263, lon: 51.613}
  title:
    ru: Пересадка в Дохе и забытая сумочка
    en: The Doha layover and the forgotten bag
  text:
    ru: |
      В Дохе у нас было восемь часов. Первым делом мы присели в одной из бесчисленных зон ожидания и сходили освежиться. Потом встали и пошли дальше. Красная сумочка Comme des Garçons со всеми документами осталась лежать на креслах.
      Пропажу мы обнаружили примерно через полчаса. Следующие полчаса бегали по аэропорту с вытаращенными глазами.
      Сумочка нас дождалась. Инфаркт, слава богу, тоже согласился подождать ещё какое-то время, и мы продолжили слоняться по аэропорту. С документами это делать значительно приятнее.
    en: |
      We had eight hours in Doha. First we sat down in one of the countless waiting areas and went to freshen up. Then we got up and moved on. The red Comme des Garçons bag with all our documents stayed behind on the seats.
      We noticed it was gone about half an hour later. We spent the next half hour running around the airport, wide-eyed.
      The bag had waited for us. The heart attack, thank God, also agreed to wait a while longer, and we went back to wandering the airport. It's much more pleasant with your documents.
- id: doha-grass
  day: "2026-11-03"
  from: "18:30"
  to: "23:59"
  topics: [details]
  place: {name: "Hamad International Airport, Doha", lat: 25.270, lon: 51.611}
  title:
    ru: Сон на траве
    en: Sleeping on the grass
  text:
    ru: |
      Для сна в аэропорту есть специальные места. Мы выбрали траву.
      Трава там искусственная, а деревья настоящие. Лежишь под деревом, в аэропорту, посреди пустыни, где-то между Кипром и Америкой. Очень круто.
    en: |
      The airport has proper places to sleep. We chose the grass.
      The grass is artificial, the trees are real. You lie under a tree, inside an airport, in the middle of a desert, somewhere between Cyprus and America. Very cool.
  tip:
    ru: Восемь часов в Хамаде — это не страшно. Ищите зелёную зону с деревьями.
    en: Eight hours at Hamad is nothing to fear. Look for the indoor garden with the trees.
  layout: field
  photos: ["20261103-181842", "20261103-144443"]
- id: jfk
  day: "2026-11-04"
  from: "07:00"
  to: "10:40"
  topics: []
  place: {name: "JFK Airport", lat: 40.648, lon: -73.791}
  title:
    ru: Прилёт
    en: Landing
  text:
    ru: Прилетели рано утром. Отель у нас был на 48-й улице, в пяти минутах от Таймс-сквер. Заселение начиналось в четыре. Так что знакомство с Нью-Йорком прошло с рюкзаками и без душа.
    en: We landed early in the morning. Our hotel was on 48th Street, five minutes from Times Square. Check-in started at four. So we met New York with backpacks on and without a shower.
- id: card-tricks
  day: "2026-11-04"
  topics: [people]
  place: {name: "voco Times Square Broadway", lat: 40.7597, lon: -73.9840}
  title:
    ru: Фокусы в лобби
    en: Card tricks in the lobby
  text:
    ru: Пока мы разбирались с вещами, Макар показывал в лобби карточные фокусы. Всем, кто не успел отвернуться. Публика была благодарная.
    en: While we sorted out the bags, Makar did card tricks in the lobby. For anyone who didn't look away in time. A grateful audience.
- id: bull
  day: "2026-11-04"
  from: "11:30"
  to: "13:30"
  topics: [art, views]
  place: {name: "Wall Street, Charging Bull & Fearless Girl", lat: 40.7056, lon: -74.0134}
  title:
    ru: Бык и девочка
    en: The bull and the girl
  text:
    ru: Первым делом пошли в Финансовый район. Бронзовый бык стоит у Уолл-стрит, и вокруг него всегда очередь. Напротив биржи стоит «Бесстрашная девочка». Вид у неё такой, будто главная здесь она.
    en: First we went to the Financial District. The bronze bull stands near Wall Street with a permanent queue around it. Across from the Stock Exchange stands Fearless Girl. She looks like she's the one in charge.
  price: {usd: 0, note: {ru: "бесплатно", en: "free"}}
- id: liberty
  day: "2026-11-04"
  from: "13:30"
  to: "16:00"
  topics: [views]
  place: {name: "Liberty Island", lat: 40.6892, lon: -74.0445}
  title:
    ru: Статуя Свободы
    en: The Statue of Liberty
  text:
    ru: Потом кораблик из Бэттери-парка к острову Свободы. Вблизи статуя больше, чем на фотографиях. Это, впрочем, можно сказать про весь Нью-Йорк.
    en: Then a boat from Battery Park to Liberty Island. Up close the statue is bigger than in photos. Which, to be fair, is true of all of New York.
  price: {usd: 140, per: family, note: {ru: "$139.80 за троих, Statue City Cruises", en: "$139.80 for three, Statue City Cruises"}}
  link: "https://www.cityexperiences.com/new-york/city-cruises/statue/"
  check: true
- id: dinner-150
  photos: ["20261104-213747_IMG_1242"]  # Natasha's photos
  day: "2026-11-04"
  from: "17:00"
  to: "19:00"
  topics: [food, metro]
  place: {name: "Lower Manhattan", lat: 40.709, lon: -74.012}
  title:
    ru: Ужин за $150 и первое метро
    en: A $150 dinner and our first subway
  text:
    ru: |
      Вечером поужинали в кафе. Счёт был $150. Это не опечатка. Здесь к цене в меню прибавляют налог, к налогу прибавляют чаевые, а к чаевым прибавляется ощущение, что ты что-то сделал не так.
      Макар уснул прямо за столом, крепко, по-взрослому. Такси до отеля стоило бы ещё долларов шестьдесят. Мы посмотрели на спящего сына, потом друг на друга и пошли в метро.
      В метро мы долго не могли понять, какой поезд нам нужен. Наташа несла Макара. Я нёс ответственность. В итоге разобрались.
    en: |
      In the evening we had dinner at a café. The bill was $150. That's not a typo. Here they add tax to the menu price, add a tip to the tax, and add to the tip a feeling that you've done something wrong.
      Makar fell asleep right at the table, deeply, like a grown-up. A taxi to the hotel would have been another sixty dollars or so. We looked at our sleeping son, then at each other, and went down into the subway.
      In the subway we spent a long time working out which train we needed. Natasha carried Makar. I carried the responsibility. We figured it out in the end.
  price: {usd: 150, per: family, note: {ru: "ужин на троих с налогом и чаевыми", en: "dinner for three, tax and tip included"}}

  # ---------- Day 2 ----------
- id: dc-tour
  day: "2026-11-05"
  from: "09:00"
  to: "11:40"
  topics: []
  place: {name: "Washington, D.C.", lat: 38.8893, lon: -77.0502}
  title:
    ru: Автобус в Вашингтон и гид Дэвид
    en: The bus to Washington and our guide David
  text:
    ru: 'На второй день мы уехали из Нью-Йорка. Экскурсия в Вашингтон на автобусе, бронировали через GetYourGuide. Гида звали Дэвид. Английский у него был не самый лучший, а экскурсия была отличная. Так бывает: человек знает, о чём говорит, и этого хватает.'
    en: "On day two we left New York. A bus tour to Washington, booked through GetYourGuide. Our guide was David. His English wasn't the best, and the tour was excellent. It happens: a man knows what he's talking about, and that's enough."
  price: {usd: 97, per: person, note: {ru: "≈$97 (€87) на человека, тур через GetYourGuide; нам троим ≈$290", en: "≈$97 (€87) per person, tour booked on GetYourGuide; ≈$290 for the three of us"}}
  link: "https://www.getyourguide.com/"
  check: true
- id: arlington
  photos: ["20261105-160712_IMG_1243", "20261105-161018_IMG_2740", "20261105-161103_IMG_1246"]  # Natasha's photos
  day: "2026-11-05"
  from: "11:40"
  to: "12:30"
  topics: []
  place: {name: "Arlington National Cemetery", lat: 38.8783, lon: -77.0687}
  title:
    ru: Арлингтонское кладбище
    en: Arlington National Cemetery
  text:
    ru: Были на Арлингтонском кладбище. Ряды одинаковых белых камней уходят до горизонта. Разговаривать там хочется тише.
    en: We went to Arlington National Cemetery. Rows of identical white stones run all the way to the horizon. You find yourself talking more quietly.
  check: true
- id: korea-lincoln
  day: "2026-11-05"
  from: "12:30"
  to: "13:15"
  topics: [art]
  place: {name: "Lincoln Memorial", lat: 38.8893, lon: -77.0502}
  title:
    ru: Солдаты в дождевиках и Линкольн
    en: Soldiers in ponchos, and Lincoln
  text:
    ru: |
      Потом мемориал ветеранов войны в Корее. Стальные солдаты в дождевиках идут через кусты, и кажется, что сейчас кто-нибудь обернётся.
      Рядом Линкольн. Он сидит. Ему, в отличие от нас, торопиться некуда.
    en: |
      Then the Korean War Veterans Memorial. Steel soldiers in ponchos walk through the bushes, and it feels like one of them is about to turn around.
      Next door is Lincoln. He is sitting down. Unlike us, he's in no hurry.
  price: {usd: 0, note: {ru: "бесплатно", en: "free"}}
- id: air-space
  day: "2026-11-05"
  from: "13:15"
  to: "14:40"
  topics: [art]
  place: {name: "National Air and Space Museum", lat: 38.8882, lon: -77.0199}
  title:
    ru: Музей авиации и космонавтики
    en: The Air and Space Museum
  text:
    ru: В Музее авиации и космонавтики Макар сел за штурвал тренажёра. Вход бесплатный, как во все музеи Смитсоновского института. После вчерашнего ужина это казалось подозрительным.
    en: At the Air and Space Museum, Makar took the controls of a cockpit simulator. Entry is free, as in all the Smithsonian museums. After last night's dinner, that seemed suspicious.
  price: {usd: 0, note: {ru: "бесплатно", en: "free"}}
- id: capitol
  day: "2026-11-05"
  from: "14:40"
  to: "15:10"
  topics: [views]
  place: {name: "U.S. Capitol", lat: 38.8899, lon: -77.0091}
  title:
    ru: Капитолий
    en: The Capitol
  text:
    ru: У Капитолия сфотографировали Макара с Машей, дочкой наших друзей. Маша тоже пианистка и тоже приехала на конкурс. Через три дня оба станут лауреатами. На этой фотографии они пока просто дети на газоне.
    en: Outside the Capitol we took a photo of Makar with Masha, our friends' daughter. Masha is a pianist too, here for the same competition. In three days they'll both be prize-winners. In this photo they're just two kids on a lawn.
  privacy: masha
- id: white-house
  day: "2026-11-05"
  from: "15:10"
  to: "16:00"
  topics: [views]
  place: {name: "The White House", lat: 38.8997, lon: -77.0366}
  title:
    ru: Белый дом
    en: The White House
  text:
    ru: Белый дом смотрели с северной стороны, от Лафайет-сквер, через ограду. Как все.
    en: We saw the White House from the north side, from Lafayette Square, through the fence. Like everybody.
- id: lady-in-frame
  day: "2026-11-05"
  topics: [details, people]
  place: {name: "Washington, D.C.", lat: 38.8999, lon: -77.0365}
  title:
    ru: Женщина, которая была везде
    en: The woman who was everywhere
  text:
    ru: |
      Весь день в наши кадры попадала одна и та же женщина. На кладбище, в красной кофте. У Белого дома. На тротуаре.
      Мы её не знаем. К вечеру она стала почти членом группы. Если вы узнали себя, спасибо: без вас этот день был бы скучнее.
    en: |
      All day the same woman kept walking into our shots. At the cemetery, in a red top. At the White House. On the pavement.
      We don't know her. By the evening she was almost part of the group. If you recognise yourself, thank you: the day would have been duller without you.
  privacy: stranger
  layout: field
  photos: ["20261105-194251", "20261105-203452", "20261105-162141"]
- id: weehawken
  day: "2026-11-05"
  from: "20:00"
  to: "20:55"
  topics: [views]
  place: {name: "Weehawken waterfront, NJ", lat: 40.772, lon: -74.016}
  title:
    ru: Ночной Манхэттен с того берега
    en: Manhattan at night from across the river
  text:
    ru: По дороге обратно автобус остановился на набережной в Нью-Джерси. Через Гудзон был виден весь Мидтаун. Отсюда мы привезли больше всего фотографий за день. Город, в котором мы жили уже второй день, впервые показался нам целиком.
    en: On the way back the bus stopped on the New Jersey waterfront. Across the Hudson lay all of Midtown. We took more photos here than anywhere else that day. The city we'd been living in for two days showed itself to us whole for the first time.
  photos: ["20261106-013848_IMG_0130-v", "20261106-013906_IMG_0132-v", "20261106-013915_IMG_0133-v", "20261106-013933_IMG_0135-v"]
- id: times-sq-1
  day: "2026-11-05"
  from: "20:55"
  to: "23:59"
  topics: [views]
  place: {name: "Times Square", lat: 40.758, lon: -73.9855}
  title:
    ru: Таймс-сквер
    en: Times Square
  text:
    ru: Вернулись к ночи. Таймс-сквер в пяти минутах от отеля, и мы оказывались там каждый вечер, даже когда никуда не собирались.
    en: We got back at night. Times Square is five minutes from the hotel, and we ended up there every evening, even when we weren't going anywhere.
  price: {usd: 0, note: {ru: "бесплатно", en: "free"}}

  # ---------- Day 3 ----------
- id: rehearsal-room
  photos: ["20261106-152233_IMG_3021"]  # Natasha's photos
  day: "2026-11-06"
  from: "08:00"
  to: "10:00"
  topics: [music]
  place: {name: "Midtown", lat: 40.757, lon: -73.983}
  title:
    ru: Час с пианино
    en: An hour with a piano
  text:
    ru: Утром сняли небольшую комнату с пианино. Макар репетировал час. До конкурса оставалось два дня.
    en: In the morning we rented a small room with a piano. Makar practised for an hour. Two days to go before the competition.
  price: {usd: null, per: family}
  check: true
- id: roof-bar
  day: "2026-11-06"
  from: "10:00"
  to: "12:00"
  topics: [views]
  place: {name: "voco Times Square Broadway, Roof Bar", lat: 40.7597, lon: -73.9840}
  title:
    ru: Крыша нашего отеля
    en: Our hotel's rooftop
  text:
    ru: Потом поднялись на крышу нашего отеля, в Roof Bar. Сверху Таймс-сквер выглядит спокойнее. Сверху вообще всё выглядит спокойнее.
    en: Then we went up to our hotel's Roof Bar. From above, Times Square looks calmer. Everything looks calmer from above.
- id: esb
  day: "2026-11-06"
  from: "13:00"
  to: "15:10"
  topics: [views]
  place: {name: "Empire State Building", lat: 40.7484, lon: -73.9857}
  title:
    ru: Эмпайр-стейт-билдинг
    en: The Empire State Building
  text:
    ru: Чтобы проверить это ещё раз, поехали на Эмпайр-стейт-билдинг. Смотровая площадка на 86-м этаже открытая, с ветром. Билет стоил $60 за взрослого. Город сверху был тот же, только больше.
    en: To check that again, we went up the Empire State Building. The 86th-floor deck is open to the wind. Tickets were $60 per adult. The city from above was the same, only bigger.
  price: {usd: 60, per: adult, note: {ru: "мы платили $60 за взрослого, детский дешевле; на сайте «от $46» в зависимости от времени", en: "we paid $60 per adult, kids less; the website says 'from $46' depending on time slot"}}
  link: "https://www.esbnyc.com/buy-tickets/86th-floor-observation-deck"
- id: moma
  day: "2026-11-06"
  from: "15:10"
  to: "18:00"
  topics: [art]
  place: {name: "MoMA", lat: 40.7614, lon: -73.9776}
  title:
    ru: MoMA
    en: MoMA
  text:
    ru: Вечером MoMA, вшестером, вместе с семьёй Маши. «Звёздная ночь» Ван Гога, часы Дали, банки супа Уорхола. Всё, что видел в учебниках, висит на стене. Рядом стоят люди с телефонами, и мы среди них.
    en: In the evening, MoMA, six of us, with Masha's family. Van Gogh's Starry Night, Dalí's clocks, Warhol's soup cans. Everything you saw in textbooks is hanging on a wall. People with phones stand in front of it, and we're among them.
  link: "https://www.moma.org/"
  check: true
- id: moma-hack
  day: "2026-11-06"
  topics: [details, art]
  place: {name: "MoMA", lat: 40.7614, lon: -73.9776}
  image: edited/moma-pass-front-masked.jpg
  title:
    ru: Лайфхак от Наташи
    en: Natasha's hack
  text:
    ru: Обычные билеты на шестерых стоили бы $120. Наташа выяснила, что годовое членство стоит $90 и позволяет провести с собой ещё пятерых. Мы сэкономили $30 и получили карточку на год. Пользоваться ей нам негде, но приятно.
    en: Regular tickets for six would have been $120. Natasha found out that an annual membership costs $90 and lets you bring five guests. We saved $30 and got a card for a year. We have nowhere to use it, but it's nice.
  price: {usd: 90, per: family, note: {ru: "членство на 6 человек вместо $120 за билеты", en: "membership for six instead of $120 in tickets"}}
  tip:
    ru: Если вас четверо взрослых или больше, сравните цену годового членства MoMA с билетами.
    en: If you're four or more adults, compare MoMA's annual membership with ticket prices.
- id: moma-cap
  day: "2026-11-06"
  topics: [details, art]
  place: {name: "MoMA Design Store", lat: 40.7614, lon: -73.9776}
  title:
    ru: Сувениры и кепка
    en: Souvenirs and the cap
  text:
    ru: В магазине музея купили до фига сувениров. Я купил кепку и проходил в ней до конца поездки. Дальше её можно искать на каждой фотографии.
    en: At the museum shop we bought a ton of souvenirs. I bought a cap and wore it for the rest of the trip. From here on, look for it in every photo.
  layout: field
  photos: ["20261106-223934", "20261106-223939", "20261110-203059"]
- id: niagara-bus
  day: "2026-11-07"
  from: "00:00"
  to: "07:30"
  topics: []
  place: {name: "New York State", lat: 42.952, lon: -78.602}
  title:
    ru: Шесть часов в автобусе
    en: Six hours on a bus
  text:
    ru: Ниагара от Нью-Йорка далеко. Шесть часов на автобусе туда и шесть обратно. Выехали затемно.
    en: Niagara is a long way from New York. Six hours on a bus there and six back. We left in the dark.
  price: {usd: 144, per: person, note: {ru: "≈$144 (€129) на человека, тур через GetYourGuide; нам троим ≈$431", en: "≈$144 (€129) per person, tour booked on GetYourGuide; ≈$431 for the three of us"}}
  check: true
- id: maid-of-mist
  day: "2026-11-07"
  from: "07:30"
  to: "10:00"
  topics: [views]
  place: {name: "Maid of the Mist", lat: 43.0862, lon: -79.0675}
  title:
    ru: Maid of the Mist
    en: Maid of the Mist
  text:
    ru: 'На канадскую сторону мы не переходили: визы нет. С американской стороны катались на кораблике Maid of the Mist. Всем выдают синие дождевики. Они не помогают, но без них было бы хуже.'
    en: "We didn't cross to the Canadian side: no visa. From the American side we took the Maid of the Mist boat. Everyone gets a blue poncho. It doesn't help, but it would be worse without it."
  link: "https://www.maidofthemist.com/"
  price: {usd: null, per: person}
- id: cave-winds
  day: "2026-11-07"
  from: "10:00"
  to: "13:00"
  topics: [views]
  place: {name: "Cave of the Winds", lat: 43.0826, lon: -79.0717}
  title:
    ru: Cave of the Winds
    en: Cave of the Winds
  text:
    ru: |
      Потом Cave of the Winds: лифт вниз, а дальше деревянные мостки прямо под водопадом. Тут дождевики жёлтые.
      Ничего особенного в этот день не происходило. Но водопад впечатляет. Двенадцать часов в автобусе ради него не жалко.
    en: |
      Then Cave of the Winds: a lift down, then wooden boardwalks right under the falls. Here the ponchos are yellow.
      Nothing much happened that day. But the falls are impressive. Twelve hours on a bus for them — no regrets.
  link: "https://www.niagarafallsstatepark.com/attractions-and-tours/cave-of-the-winds"
  price: {usd: null, per: person}
  tip:
    ru: "Без канадской визы с американской стороны можно увидеть всё главное. Лучший фронтальный вид на Подкову, правда, с канадской."
    en: "Without a Canadian visa you can still see all the main sights from the US side. The best head-on view of the Horseshoe is from Canada, though."

  # ---------- Day 5 ----------
- id: carnegie-rehearsal
  day: "2026-11-08"
  from: "00:00"
  to: "12:00"
  topics: [music]
  place: {name: "Carnegie Hall", lat: 40.7651, lon: -73.9799}
  title:
    ru: Репетиция в Карнеги-холле
    en: Rehearsal at Carnegie Hall
  text:
    ru: Утром репетиция в зале. Мы сидели в Карнеги-холле. Макар сидел за роялем в Карнеги-холле. Это разные вещи.
    en: A morning rehearsal in the hall. We were sitting in Carnegie Hall. Makar was sitting at the piano in Carnegie Hall. Those are different things.
- id: carnegie-concert
  day: "2026-11-08"
  from: "12:00"
  to: "16:00"
  topics: [music]
  place: {name: "Carnegie Hall", lat: 40.7651, lon: -73.9799}
  title:
    ru: Первое место
    en: First place
  text:
    ru: |
      Макар выступил и занял первое место. Ещё ему дали $50 как самому младшему участнику.
      Это был единственный раз за поездку, когда Нью-Йорк заплатил нам, а не мы ему.
    en: |
      Makar played and took first place. They also gave him $50 as the youngest performer.
      It was the only time on the whole trip that New York paid us, rather than the other way round.
  price: {usd: -50, per: child, note: {ru: "единственный раз, когда Нью-Йорк заплатил нам", en: "the only time New York paid us"}}
  check: true
- id: nypl
  day: "2026-11-08"
  from: "16:00"
  to: "18:00"
  topics: [art]
  place: {name: "New York Public Library", lat: 40.7532, lon: -73.9822}
  title:
    ru: Публичная библиотека
    en: The Public Library
  text:
    ru: Потом пошли в публичную библиотеку на Пятой авеню. У входа два каменных льва. Их зовут Терпение и Стойкость. В тот день нам пригодилось и то и другое.
    en: Then we went to the Public Library on Fifth Avenue. Two stone lions guard the entrance. Their names are Patience and Fortitude. That day we'd needed both.
  price: {usd: 0, note: {ru: "бесплатно", en: "free"}}
- id: stardust
  day: "2026-11-08"
  from: "18:00"
  to: "23:59"
  topics: [music]
  place: {name: "Ellen's Stardust Diner", lat: 40.7616, lon: -73.9836}
  title:
    ru: Ужин, где поют официанты
    en: Dinner with singing waiters
  text:
    ru: Ужинали в Ellen's Stardust Diner на Бродвее. Официанты там — будущие бродвейские актёры, и они поют прямо между столиками. Кто-то несёт тарелки, кто-то берёт высокую ноту. Мы отмечали первое место, и казалось, что поют немного и для нас.
    en: We had dinner at Ellen's Stardust Diner on Broadway. The waiters are future Broadway performers, and they sing right between the tables. One carries plates, another hits a high note. We were celebrating first place, and it felt like they were singing a little bit for us.
  link: "https://www.ellensstardustdiner.com/"
  price: {usd: 121, per: family, note: {ru: "ужин на троих, $120.68 с налогом и чаевыми", en: "dinner for three, $120.68 with tax and tip"}}

  # ---------- Day 6 ----------
- id: rink
  day: "2026-11-09"
  from: "00:00"
  to: "14:00"
  topics: []
  place: {name: "The Rink at Rockefeller Center", lat: 40.7587, lon: -73.9787}
  title:
    ru: Каток у Рокфеллер-центра
    en: The rink at Rockefeller Center
  text:
    ru: Наташа с Макаром пошли на каток у Рокфеллер-центра, вместе с друзьями и Машей. Маша тоже пианистка, тоже лауреат и тоже играла в Карнеги-холле. На льду это не имело никакого значения.
    en: Natasha and Makar went skating at Rockefeller Center with our friends and Masha. Masha is a pianist too, also a prize-winner, and also played Carnegie Hall. On the ice none of that mattered.
  price: {usd: null, per: person}
  privacy: masha
- id: central-park
  day: "2026-11-09"
  from: "14:00"
  to: "17:40"
  topics: [views]
  place: {name: "Central Park", lat: 40.7681, lon: -73.9719}
  title:
    ru: Центральный парк
    en: Central Park
  text:
    ru: После катка прошлись по Пятой авеню, мимо магазинов, и дошли до Центрального парка. Ноябрь, жёлтые листья, белки. Белкам до нас не было никакого дела.
    en: After the rink we walked up Fifth Avenue, past the shops, to Central Park. November, yellow leaves, squirrels. The squirrels couldn't have cared less about us.
  check: true

  # ---------- Day 7 ----------
- id: grand-central
  day: "2026-11-09"
  from: "17:40"
  to: "23:59"
  topics: []
  place: {name: "Grand Central Terminal", lat: 40.7527, lon: -73.9772}
  title:
    ru: Grand Central
    en: Grand Central
  text:
    ru: Уже в сумерках дошли до Grand Central. Это вокзал, куда приходят не только за поездами. Мы, например, пришли просто посмотреть. А потом всё-таки спустились в метро.
    en: By dusk we reached Grand Central. It's a station people visit for more than trains. We, for one, just came to look. And then we did go down to the subway after all.
  price: {usd: 0, note: {ru: "бесплатно", en: "free"}}
- id: memorial-911
  day: "2026-11-10"
  from: "00:00"
  to: "12:00"
  topics: []
  place: {name: "9/11 Memorial", lat: 40.7115, lon: -74.0134}
  title:
    ru: Мемориал 9/11
    en: The 9/11 Memorial
  text:
    ru: Последний день начали с мемориала 9/11. Два квадратных бассейна на месте башен. Вода уходит вниз, в квадрат поменьше, и дна не видно. По бортам имена. Здесь все говорят тихо.
    en: We started the last day at the 9/11 Memorial. Two square pools where the towers stood. The water falls into a smaller square, and you can't see the bottom. Names are cut along the edges. Everyone here speaks quietly.
  price: {usd: 0, note: {ru: "мемориал бесплатный", en: "the memorial is free"}}
- id: brooklyn-bridge
  day: "2026-11-10"
  from: "12:00"
  to: "13:30"
  topics: [views]
  place: {name: "Brooklyn Bridge", lat: 40.7061, lon: -73.9969}
  title:
    ru: Бруклинский мост
    en: The Brooklyn Bridge
  text:
    ru: Потом Бруклинский мост. Пешеходная дорожка идёт над машинами, и Манхэттен оттуда видно почти целиком.
    en: Then the Brooklyn Bridge. The footpath runs above the cars, and you can see almost all of Manhattan from it.
  price: {usd: 0, note: {ru: "бесплатно", en: "free"}}
- id: katz
  day: "2026-11-10"
  from: "13:30"
  to: "15:00"
  topics: [food]
  place: {name: "Katz's Delicatessen", lat: 40.7223, lon: -73.9874}
  title:
    ru: Сэндвич у Каца
    en: A sandwich at Katz's
  text:
    ru: Обедали у Каца. На входе выдают билетик и предупреждают, что терять его нельзя. Предупреждают так серьёзно, что держишь его крепче, чем документы в Дохе. Сэндвич с пастрами размером с небольшую книгу.
    en: Lunch at Katz's. At the door they hand you a ticket and warn you not to lose it. They say it so seriously that you hold it tighter than we held our documents in Doha. The pastrami sandwich is the size of a small book.
  link: "https://katzsdelicatessen.com/"
  price: {usd: 105, per: family, note: {ru: "на троих, $105.36", en: "for three, $105.36"}}
- id: soho-ghostbusters
  day: "2026-11-10"
  from: "15:00"
  to: "18:00"
  topics: [art]
  place: {name: "Hook & Ladder 8, 14 N Moore St", lat: 40.7197, lon: -74.0066}
  title:
    ru: Сохо и «Охотники за привидениями»
    en: SoHo and the Ghostbusters firehouse
  text:
    ru: 'Дальше Сохо: чугунные фасады, пожарные лестницы, магазины. И пожарная часть из «Охотников за привидениями». Она настоящая, в ней до сих пор работают пожарные. Мы постояли у ворот, как все.'
    en: "Then SoHo: cast-iron facades, fire escapes, shops. And the firehouse from Ghostbusters. It's real, and firefighters still work there. We stood by the gates, like everybody."
  price: {usd: 0, note: {ru: "бесплатно", en: "free"}}
- id: aladdin
  day: "2026-11-10"
  from: "18:00"
  to: "23:59"
  topics: [music, art]
  place: {name: "New Amsterdam Theatre", lat: 40.7562, lon: -73.9878}
  title:
    ru: «Аладдин» на Бродвее
    en: Aladdin on Broadway
  text:
    ru: Вечером «Аладдин» на Бродвее. Лучшего конца поездки мы бы не придумали.
    en: In the evening, Aladdin on Broadway. We couldn't have planned a better ending.
  link: "https://www.aladdinthemusical.com/"
  price: {usd: null, per: person}

  # ---------- Day 8 ----------
- id: subway-broke
  day: "2026-11-11"
  from: "00:00"
  to: "12:00"
  topics: [metro]
  place: {name: "New York", lat: 40.7597, lon: -73.9840}
  title:
    ru: Метро сломалось, бежим на автобус
    en: The subway broke, run for the bus
  text:
    ru: |
      Уезжали рано утром. В это утро сломалось метро. Начинали мы с того, что не могли в нём разобраться, а закончили тем, что оно не смогло разобраться с нами.
      Бежали на автобус. Зато из окна удалось снять окраины, а не только открыточный центр. Это тоже Нью-Йорк, просто на него редко смотрят.
    en: |
      We left early in the morning. That morning the subway broke down. We started the trip unable to figure it out, and ended it with the subway unable to figure us out.
      We ran for a bus. On the plus side, from its window we filmed the outskirts, not just the postcard centre. That's New York too; people just rarely look at it.
  layout: field
  photos: ["20261111-120702"]
- id: flight-home
  day: "2026-11-11"
  from: "12:00"
  to: "23:59"
  topics: []
  place: {name: "JFK Airport", lat: 40.6413, lon: -73.7781}
  title:
    ru: Обратно через Доху
    en: Back via Doha
  text:
    ru: Самолёт, снова Доха, и домой.
    en: The plane, Doha again, and home.
notes:
- id: note-hamad
  topics:
  - transport
  - details
  day: '2026-11-03'
  moment: doha-grass
  title:
    ru: Сад внутри аэропорта
    en: A garden inside an airport
  text:
    ru: |
      Зелёная зона в аэропорту Хамад называется The Orchard. Это тропический сад площадью около 10 000 квадратных метров под стеклянной крышей, его открыли в ноябре 2023 года.
      А посреди главного зала сидит семиметровый жёлтый медведь с лампой на голове. Это скульптура швейцарского художника Урса Фишера. Её продали на аукционе Christie's за 6,8 миллиона долларов.
    en: |
      The green zone at Hamad airport is called The Orchard: a tropical garden of about 10,000 square metres under a glass roof, opened in November 2023.
      And in the middle of the main hall sits a seven-metre yellow teddy bear with a lamp on its head. It's by the Swiss artist Urs Fischer. It sold at Christie's for 6.8 million dollars.
  sources:
  - https://en.wikipedia.org/wiki/Hamad_International_Airport
  check: true
  photo: doha/20261103-144443_IMG_9690.jpg
- id: note-maid-of-mist
  topics:
  - transport
  day: '2026-11-07'
  moment: maid-of-mist
  title:
    ru: Кораблик, которому 180 лет
    en: A boat line 180 years old
  text:
    ru: 'Первый Maid of the Mist пошёл по реке в 1846 году. Тогда это был паром: моста через Ниагару ещё не было, и людей с грузом возили с американского берега на канадский. Мост построили, паром стал не нужен, и кораблик переквалифицировался в аттракцион. Так и плавает до сих пор.'
    en: "The first Maid of the Mist sailed in 1846. Back then it was a ferry: there was no bridge over the Niagara yet, and it carried people and cargo between the American and Canadian banks. Then the bridge was built, the ferry became unnecessary, and the boat retrained as an attraction. It's been at it ever since."
  sources:
  - https://en.wikipedia.org/wiki/Maid_of_the_Mist
- id: note-grand-central
  topics:
  - transport
  - details
  day: '2026-11-09'
  moment: grand-central
  title:
    ru: Небо задом наперёд
    en: The sky the wrong way round
  text:
    ru: |
      Потолок главного зала Grand Central расписан созвездиями. Если присмотреться, звёздное небо там нарисовано зеркально, задом наперёд. Ошибку заметили почти сразу после открытия в 1913 году. Объяснение придумали красивое: это небо, каким его видит Бог, то есть сверху.
      В углу потолка оставлен маленький тёмный прямоугольник. Так выглядел весь потолок до реставрации 1990-х: чёрный от десятилетий табачного дыма.
    en: |
      The ceiling of Grand Central's main hall is painted with constellations. Look closely and the sky is mirrored, back to front. The mistake was noticed soon after the station opened in 1913. The explanation offered was a nice one: it's the sky as God sees it, from above.
      In one corner a small dark rectangle has been left uncleaned. That's what the whole ceiling looked like before the 1990s restoration: black from decades of tobacco smoke.
  sources:
  - https://en.wikipedia.org/wiki/Grand_Central_Terminal
- id: note-subway-express
  topics:
  - metro
  day: '2026-11-04'
  moment: dinner-150
  title:
    ru: Почему мы запутались
    en: Why we got confused
  text:
    ru: |
      Нью-йоркское метро открылось в 1904 году. В нём 472 станции, больше, чем в любом другом метро мира, и оно работает круглосуточно.
      Путаница у приезжих почти всегда одна и та же: на многих линиях есть экспрессы и обычные поезда. Они идут по одному маршруту, иногда с одной платформы, но экспресс проезжает мелкие станции без остановки. Сел не в тот и уехал мимо своей станции. С нами в первый вечер было примерно так.
    en: |
      The New York subway opened in 1904. It has 472 stations, more than any other metro in the world, and it runs around the clock.
      Visitors almost always get confused the same way: many lines have express and local trains. They follow the same route, sometimes from the same platform, but the express skips the small stations. Get on the wrong one and you sail past your stop. That's roughly what happened to us on the first evening.
  sources:
  - https://en.wikipedia.org/wiki/New_York_City_Subway
  photo: day7-last/20261110-143732_IMG_0954.jpg
- id: note-omny
  topics:
  - metro
  title:
    ru: Без жетонов и без карточек
    en: No tokens, no cards
  text:
    ru: 'Знаменитых нью-йоркских жетонов давно нет, и жёлтые карточки MetroCard тоже уходят в прошлое. Сейчас за проезд платят системой OMNY: прикладываешь к турникету банковскую карту или телефон, и всё. Билет покупать не нужно вообще.'
    en: "The famous New York tokens are long gone, and the yellow MetroCard is on its way out too. Now you pay with OMNY: tap a bank card or a phone on the turnstile and you're through. No ticket to buy at all."
  sources:
  - https://en.wikipedia.org/wiki/OMNY
  photo: day1-arrival/20261104-231658_IMG_9908.jpg
- id: note-bull
  topics:
  - art
  - details
  day: '2026-11-04'
  photo: notes/bull.jpg
  moment: bull
  title:
    ru: Бык, которого никто не заказывал
    en: The bull nobody ordered
  text:
    ru: |
      Бронзового быка никто не заказывал. Скульптор Артуро Ди Модика отлил его на свои деньги и в декабре 1989 года ночью, без всякого разрешения, привёз и поставил перед Нью-Йоркской фондовой биржей. Подарок городу к Рождеству. Бык весит больше трёх тонн.
      Полиция его увезла, но горожане возмутились, и быка поставили неподалёку, где он стоит до сих пор.
      «Бесстрашную девочку» поставили в 2017 году напротив быка, лицом к нему. Через год её перенесли к бирже. Теперь она смотрит на биржу, а бык смотрит в пустоту.
    en: |
      Nobody ordered the bronze bull. The sculptor Arturo Di Modica cast it with his own money and, one night in December 1989, without any permission, trucked it in and set it down in front of the New York Stock Exchange. A Christmas present to the city. The bull weighs over three tonnes.
      The police hauled it away, the public objected, and the bull was put up nearby, where it still stands.
      Fearless Girl was installed in 2017, facing the bull. A year later she was moved to the Stock Exchange. Now she stares at the Exchange, and the bull stares at nothing.
  sources:
  - https://en.wikipedia.org/wiki/Charging_Bull
  - https://en.wikipedia.org/wiki/Fearless_Girl
- id: note-korea
  topics:
  - art
  day: '2026-11-05'
  moment: korea-lincoln
  title:
    ru: Девятнадцать и тридцать восемь
    en: Nineteen and thirty-eight
  text:
    ru: 'В мемориале ветеранов войны в Корее 19 стальных солдат. Рядом стоит полированная гранитная стена, и в ней они отражаются. Получается 38. Это не случайность: 38-я параллель — линия, по которой Корея была разделена до войны и вдоль которой проходит граница сейчас.'
    en: "The Korean War Veterans Memorial has 19 steel soldiers. Beside them stands a polished granite wall that reflects them. That makes 38. It's deliberate: the 38th parallel is the line along which Korea was divided before the war, and roughly where the border runs today."
  sources:
  - https://en.wikipedia.org/wiki/Korean_War_Veterans_Memorial
- id: note-moma
  topics:
  - art
  day: '2026-11-06'
  moment: moma
  title:
    ru: Музей, открытый в кризис
    en: A museum opened in a crash
  text:
    ru: 'MoMA открылся 7 ноября 1929 года, через девять дней после биржевого краха, с которого началась Великая депрессия. Мы были там почти ровно в его день рождения: 6 ноября. «Звёздная ночь» Ван Гога в музее с 1941 года.'
    en: "MoMA opened on 7 November 1929, nine days after the stock market crash that started the Great Depression. We were there almost exactly on its birthday: 6 November. Van Gogh's Starry Night has been in the museum since 1941."
  sources:
  - https://en.wikipedia.org/wiki/Museum_of_Modern_Art
  - https://en.wikipedia.org/wiki/The_Starry_Night
- id: note-lions
  topics:
  - art
  day: '2026-11-08'
  moment: nypl
  title:
    ru: Как львам дали имена
    en: How the lions got their names
  text:
    ru: 'Сначала львов звали в честь основателей библиотеки: Лео Астор и Лео Ленокс, потом лорд Астор и леди Ленокс. Нынешние имена, Терпение и Стойкость, им дал мэр Фиорелло Ла Гуардия в 1930-е, во время Великой депрессии. Он сказал, что именно эти два качества понадобятся ньюйоркцам, чтобы её пережить.'
    en: "At first the lions were named after the library's founders: Leo Astor and Leo Lenox, later Lord Astor and Lady Lenox. Their current names, Patience and Fortitude, came from Mayor Fiorello La Guardia in the 1930s, during the Great Depression. He thought those were the two qualities New Yorkers needed to get through it."
  sources:
  - https://en.wikipedia.org/wiki/Patience_and_Fortitude
- id: note-esb
  topics:
  - views
  - details
  day: '2026-11-06'
  moment: esb
  title:
    ru: Самолёт в небоскрёбе
    en: A plane in the skyscraper
  text:
    ru: |
      Эмпайр-стейт-билдинг построили чуть больше чем за год и открыли в 1931 году.
      В июле 1945 года в густом тумане в него врезался военный бомбардировщик B-25, около 79-го этажа. Лифтёрша Бетти Лу Оливер упала в лифте с 75-го этажа и выжила. Это до сих пор рекорд: самое долгое падение в лифте, после которого человек остался жив. Меньше чем через двое суток во многих офисах здания снова работали.
    en: |
      The Empire State Building went up in just over a year and opened in 1931.
      In July 1945, in thick fog, a B-25 bomber flew into it around the 79th floor. The elevator operator Betty Lou Oliver fell 75 storeys in her elevator car and survived. It's still the record for the longest survived elevator fall. Less than 48 hours later, many floors were back at work.
  sources:
  - https://en.wikipedia.org/wiki/1945_Empire_State_Building_B-25_crash
- id: note-weehawken
  topics:
  - views
  day: '2026-11-05'
  moment: weehawken
  title:
    ru: Где стрелялся Гамильтон
    en: Where Hamilton was shot
  text:
    ru: Набережная в Уихокене, откуда мы смотрели на Манхэттен, известна ещё одним. Здесь, на берегу Гудзона, в 1804 году стрелялись Александр Гамильтон, один из отцов-основателей США, и вице-президент Аарон Бёрр. Гамильтон был смертельно ранен. Его портрет сейчас на десятидолларовой купюре, а про него самого есть бродвейский мюзикл «Гамильтон».
    en: The Weehawken waterfront, where we looked at Manhattan, is known for something else too. Here, on the bank of the Hudson, in 1804, Alexander Hamilton, one of America's founding fathers, fought a duel with Vice President Aaron Burr. Hamilton was fatally wounded. His face is on the ten-dollar bill now, and there's a Broadway musical about him, Hamilton.
  sources:
  - https://en.wikipedia.org/wiki/Burr%E2%80%93Hamilton_duel
- id: note-niagara-off
  topics:
  - views
  - details
  day: '2026-11-07'
  photo: day4-niagara/20261107-155111_IMG_0562.jpg
  moment: cave-winds
  title:
    ru: Водопад, который выключали
    en: The waterfall they switched off
  text:
    ru: 'В 1969 году Американский водопад выключили. Инженеры армии США построили временную дамбу и с июня по ноябрь водопада не было: воду отвели, чтобы изучить скалы и понять, не обрушится ли он. К декабрю вода снова шла. Груду камней у подножия в итоге решили не трогать.'
    en: 'In 1969 the American Falls were switched off. US Army engineers built a temporary dam and from June to November there were no falls: the water was diverted so they could study the rock and see whether it might collapse. By December the water was flowing again. In the end they decided to leave the pile of rocks at the base alone.'
  sources:
  - https://en.wikipedia.org/wiki/American_Falls
  check: true
- id: note-times-square
  topics:
  - views
  - details
  day: '2026-11-05'
  photo: day2-nov5/20261106-022021_IMG_0165.jpg
  moment: times-sq-1
  title:
    ru: Площадь имени газеты
    en: A square named after a newspaper
  text:
    ru: До 1904 года Таймс-сквер называлась Лонгакр-сквер, и там торговали лошадьми и экипажами. Потом сюда переехала газета The New York Times, и площадь переименовали в её честь. Шар в новогоднюю ночь здесь опускают с 1907 года.
    en: Until 1904 Times Square was called Longacre Square, a place for the horse and carriage trade. Then The New York Times moved in, and the square was renamed after it. The New Year's Eve ball has dropped here since 1907.
  sources:
