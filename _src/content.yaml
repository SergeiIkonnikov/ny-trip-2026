- id: note-hydrants
  topics:
  - details
  title:
    ru: Гидранты и сиамские близнецы
    en: Hydrants and Siamese twins
  text:
    ru: |
      В Нью-Йорке около ста тысяч пожарных гидрантов. Летом их открывают вместо фонтанов, и по крайней мере с конца XIX века. Город с этим долго боролся штрафами, а потом сдался и придумал компромисс: в любой пожарной части можно попросить специальную насадку-разбрызгиватель. Вода льётся, дети счастливы, давления в сети хватает на пожары.
      Изобретателем гидранта считают Фредерика Граффа из Филадельфии, 1801 год. Но доказать это нельзя: в 1836 году сгорело Патентное ведомство США вместе с большей частью архива. Патент на пожарный гидрант, возможно, сгорел при пожаре.
      А эта латунная штука с двумя жёлтыми заглушками на стене офисного здания — не гидрант, а наоборот. Через неё пожарные закачивают воду внутрь дома, в трубы и спринклеры. Из-за двух входов такое устройство называют «сиамским» соединением.
    en: |
      New York has about a hundred thousand fire hydrants. In summer people open them instead of fountains, and have done so since at least the late 19th century. For years the city fought this with fines, then gave in and found a compromise: any firehouse will give you a special spray cap. The water flows, kids are happy, and there's still enough pressure left for fires.
      The hydrant is usually credited to Frederick Graff of Philadelphia, in 1801. But nobody can prove it: in 1836 the US Patent Office burned down along with most of its records. The fire hydrant patent may have been lost in a fire.
      And this brass thing with two yellow caps on an office building's wall isn't a hydrant but its opposite. Firefighters pump water through it into the building's pipes and sprinklers. Because of its two inlets, it's called a Siamese connection.
  sources:
  - https://www.atlasobscura.com/articles/new-yorkers-have-been-illicitly-cracking-open-fire-hydrants-for-centuries
  - https://en.wikipedia.org/wiki/Frederick_Graff
  photo: day5-concert/20261109-003455_IMG_0794.jpg
