# Source of truth for the site. Every view (days, topics, map, cheat sheet) is built from `moments`.
# Times are local (`tz` per day). Photos are matched to a moment by local time range [from, to].
# price: usd = number, per = person | family | adult | child ; note = free text
# status: draft text needs Sergey's check -> `check: true`

site:
  title: {ru: "Нью-Йорк, ноябрь 2026", en: "New York, November 2026"}
  tagline:
    ru: 'Восемь дней втроём: Наташа, Макар и я. Записано для семьи и друзей.'
    en: 'Eight days, the three of us: Natasha, Makar and me. Written for family and friends.'
  intro:
    ru: |
      В начале ноября мы втроём полетели в Нью-Йорк. Повод был серьёзный: Макар играл на конкурсе в Карнеги-холле. Мы и думали, что вся поездка будет вокруг одного концерта.
      Получилось иначе. Концерт был, и Макар занял первое место, но в памяти он стоит в одном ряду с другими вещами. С автобусом в Вашингтон и гидом Дэвидом. С водопадом, ради которого мы двенадцать часов провели в дороге. С метро, в котором мы долго не могли разобраться. С ужином, где официанты поют между столиками. Город оказался больше повода, по которому мы приехали.
      Всё это мы записали прежде всего для себя, чтобы через несколько лет открыть и вспомнить. Поэтому здесь настоящие цены, ноябрь 2026 года, и мелочи, которые обычно забываются первыми. Читать можно по дням, как рассказ. А можно по темам: там собрано то, что в рассказ не поместилось.
    en: |
      In early November the three of us flew to New York. The occasion was a serious one: Makar was playing at a competition in Carnegie Hall. We assumed the whole trip would revolve around one concert.
      It turned out differently. The concert happened, and Makar took first place, but in our memory it sits alongside other things. The bus to Washington and our guide David. A waterfall we spent twelve hours on the road for. A subway we took a long time to understand. A dinner where the waiters sing between the tables. The city turned out bigger than the reason we came.
      We wrote all this down mostly for ourselves, so that in a few years we can open it and remember. That's why the prices here are real, November 2026, and why it keeps the small things that are usually the first to go. You can read it day by day, as a story. Or by topic: that's where we put what didn't fit into the story.
