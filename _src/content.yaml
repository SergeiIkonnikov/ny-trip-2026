  title:
    ru: Сделано в Индии
    en: Made in India
  text:
    ru: 'Ливнёвка на брусчатке в Дамбо. Сверху выбита рыбка и надпись «Не сбрасывайте мусор, стоки идут в водоёмы». Сбоку и снизу: «Сделано в Индии». Американская чугунная решётка из Индии лежит на бруклинской брусчатке. Глобализация в одном кадре.'
    en: 'A storm drain on the cobblestones in DUMBO. On top, a fish and the words "Dump no waste! Drains to waterways". On the side and bottom: "Made in India". An American cast-iron grate from India, lying on Brooklyn cobblestones. Globalisation in one shot.'
- id: obs-iwo-jima
  topics:
