<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ site.title[lang] }}{% endblock %}</title>
<meta name="description" content="{{ site.tagline[lang] }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title[lang] }}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ site.tagline[lang] }}">
<meta property="og:url" content="{{ page_url }}">
<meta property="og:image" content="{{ site_url }}assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="{{ 'ru_RU' if lang == 'ru' else 'en_US' }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ root }}assets/style.css?v={{ asset_v or "20261112-1530" }}">
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
<header class="top">
  <div class="g">
    <a class="brand" href="{{ home }}">NY 2026</a>
    <nav>
      <a href="{{ home }}#days">{{ t.days }}</a>
      <a class="opt" href="{{ home }}#topics">{{ t.topics }}</a>
      <a href="{{ home }}map/">{{ t.map }}</a>
      <a class="opt" href="{{ home }}repeat/">{{ 'Повторить' if lang == 'ru' else 'Repeat it' }}</a>
      <a class="lang" href="{{ other_href }}" hreflang="{{ t.other_lang }}">{{ t.other }}</a>
    </nav>
  </div>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="foot">
  <div class="g meta">
    <span>{{ t.footer }}</span>
    <span class="draft">{{ t.draft }}</span>
  </div>
</footer>
<div class="lb" id="lb" hidden>
  <button class="lb-x" aria-label="close">×</button>
  <button class="lb-prev" aria-label="prev">‹</button>
  <figure><div class="lb-media"></div><figcaption></figcaption></figure>
  <button class="lb-next" aria-label="next">›</button>
</div>
<script src="{{ root }}assets/app.js?v={{ asset_v or "20261112-1530" }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
